apply plugin: 'com.android.application'

android {
    namespace 'com.example.plugindemo'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.example.plugindemo"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // RePluginInternal.FOR_DEV / PluginApplicationClient 依赖 BuildConfig，
    // 而 AGP 8 起 BuildConfig 默认不再生成，必须显式打开。
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // PluginHostApplication / PluginManagerServer 用它在进程内通知「插件已安装」
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// ---------------------------------------------------------------------------
// 内置插件：把 pluginother 编译出的 APK 放进宿主的 assets，随宿主一起分发。
// 宿主首次点「install」时由 PluginManagerServer.ensurePluginApk() 释放到 cacheDir。
// ---------------------------------------------------------------------------
tasks.register('copyPluginApk', Copy) {
    dependsOn ':pluginother:assembleDebug'
    from rootProject.file('pluginother/build/outputs/apk/debug/pluginother-debug.apk')
    into 'src/main/assets'
    rename { 'plugin01.apk' }
}

// 用 matching + configureEach 而不是 tasks.named()，因为 AGP 的 variant 任务是在
// afterEvaluate 阶段才注册的，named() 会当场抛 UnknownTaskException。
tasks.matching { it.name == 'mergeDebugAssets' }.configureEach {
    dependsOn 'copyPluginApk'
}
